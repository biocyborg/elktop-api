[build]
  functions = "netlify/functions"
  publish = "."

# 保留你原来的 API 路径（完全不变）
[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200

# 新增接口路由（不影响旧的）
[[redirects]]
  from = "/get-link"
  to = "/.netlify/functions/get-link"
  status = 200

[dev]
  port = 8888
  functions = "netlify/functions"
