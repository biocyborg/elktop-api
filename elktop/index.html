<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 Not Found</title>
  <style>
    :root {
      --bg-color: #f5f5f7;
      --card-bg: #ffffff;
      --text-color: #1d1d1f;
      --shadow-color: rgba(0, 0, 0, 0.1);
      --border-radius: 14px;
      --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      --accent-color: #ff3b30;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: var(--font-family);
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      box-shadow: 0 8px 24px var(--shadow-color);
      padding: 40px 60px;
      text-align: center;
      max-width: 480px;
      width: 90%;
    }

    .icon {
      margin-bottom: 24px;
    }

    .icon svg {
      width: 64px;
      height: 64px;
      fill: none;
      stroke: var(--accent-color);
      stroke-width: 4;
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    p {
      font-size: 16px;
      color: #555;
      margin-bottom: 24px;
    }

    .button {
      display: inline-block;
      padding: 10px 24px;
      background-color: #007aff;
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500;
      transition: background 0.2s ease-in-out;
      cursor: pointer;
    }

    .button:hover {
      background-color: #005ecb;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <circle cx="32" cy="32" r="28" stroke="currentColor" />
        <line x1="16" y1="48" x2="48" y2="16" stroke="currentColor" />
      </svg>
    </div>
    <h1>404 - Page Not Found</h1>
    <p>Oops! The page you are looking for doesn’t exist or has been moved.</p>
    <button class="button" onclick="window.close()">Close Page</button>
  </div>
</body>
</html>
