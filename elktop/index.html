<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 Not Found</title>
  <style>
    :root {
      --bg-color: #f5f5f7;
      --card-bg: #ffffff;
      --text-color: #1d1d1f;
      --shadow-color: rgba(0, 0, 0, 0.1);
      --border-radius: 14px;
      --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      --accent-color: #ff9500;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: var(--font-family);
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      box-shadow: 0 8px 24px var(--shadow-color);
      padding: 40px 60px;
      text-align: center;
      max-width: 480px;
      width: 90%;
    }

    .icon {
      margin-bottom: 24px;
    }

    .icon svg {
      width: 100px;
      height: 100px;
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    p {
      font-size: 16px;
      color: #555;
      margin-bottom: 24px;
    }

    .button {
      display: inline-block;
      padding: 10px 24px;
      background-color: #007aff;
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500;
      transition: background 0.2s ease-in-out;
      cursor: pointer;
    }

    .button:hover {
      background-color: #005ecb;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <!-- 可爱猫咪 SVG -->
      <svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
        <path d="M64 10c-8 0-16 8-18 16-4-2-12-2-14 2-2 4 0 10 4 14-8 8-10 24-4 34-4 0-8 4-8 8s4 8 8 8c0 12 10 22 22 22h12c12 0 22-10 22-22 4 0 8-4 8-8s-4-8-8-8c6-10 4-26-4-34 4-4 6-10 4-14s-10-4-14-2c-2-8-10-16-18-16z" fill="#FFD7B5"/>
        <circle cx="48" cy="64" r="4" fill="#333"/>
        <circle cx="80" cy="64" r="4" fill="#333"/>
        <path d="M56 80c2 2 6 2 8 0" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M64 8c2-6 10-8 14-2" stroke="#FFB6B6" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M64 8c-2-6-10-8-14-2" stroke="#FFB6B6" stroke-width="2" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>404 - Page Not Found</h1>
    <p>Looks like this cat couldn't find the page either.</p>
  </div>
</body>
</html>
